<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Foxbook Control</title>
  <link rel="stylesheet" href="control.css">
  <script src="control.js" defer></script>
</head>
<body>
  <main>
    <h1>Foxbook Control</h1>
    <p>状態を確認</p>
    <div class="actions">
      <button data-action="system_info" type="button">システム情報</button>
      <button data-action="battery_status" type="button">電池</button>
      <button data-action="network_status" type="button">ネットワーク</button>
      <button data-action="audio_status" type="button">音量</button>
    </div>
    <div class="volume-control">
      <div class="volume-heading">
        <label for="volume-slider">音量を調整</label>
        <output id="volume-value" for="volume-slider">--%</output>
      </div>
      <input id="volume-slider" type="range" min="0" max="100" step="1" value="0" disabled>
      <p>スライダーを離すと設定します。</p>
    </div>
    <section aria-labelledby="score-title">
      <h2 id="score-title">楽譜</h2>
      <button data-action="sync_score" type="button">Dropboxから楽譜を同期</button>
    </section>
    <section aria-labelledby="result-title">
      <h2 id="result-title">実行結果</h2>
      <p id="status" role="status" aria-live="polite">操作を選択してください。</p>
      <pre id="output" hidden></pre>
      <p id="error-code" class="error-code" hidden></p>
    </section>
    <section aria-labelledby="session-title">
      <h2 id="session-title">セッション</h2>
      <button id="cage-logout" type="button">Cageからログアウト</button>
    </section>
    <section aria-labelledby="host-title">
      <h2 id="host-title">Native Host</h2>
      <button data-action="update_host" type="button">Hostを更新</button>
    </section>
  </main>
</body>
</html>
